# Copy to so101.toml and pass with `so101 --config so101.toml`,
# or point SO101_CFG_FILE at it. Every key is optional; unset keys keep the
# defaults in so101_cosmos/config.py, which match the verified workstation.
#
# Individual keys can also be overridden with SO101_CFG_<KEY> environment
# variables (SO101_CFG_POLICY_PORT=8001). The prefix is deliberately not plain
# SO101_ -- SO101_ROOT is read by cosmos-framework itself.

[so101]

# -- checkouts and interpreters ---------------------------------------------
framework  = "/home/zeux/cosmos-framework"
bench      = "/home/zeux/IsaacLab/so101_bench"
kit_python = "/home/zeux/IsaacLab/_isaac_sim/python.sh"

# -- the training run, relative to `framework` -------------------------------
run_dir = "outputs/train/cosmos3_action/action_sft_sim/action_policy_so101_focus5_1gpu"
job_dir = "outputs/so101_cosmos_jobs"
dataset = "examples/data/so101_bench_sim_6"
stats   = "cosmos_framework/data/generator/action/normalizer_stats/so101_lerobot_stats.json"

# -- serving contract --------------------------------------------------------
# Do not change these without retraining. Each one fails silently: the server
# keeps answering, with wrong actions.
experiment            = "action_policy_so101_nano_focus5"
action_dim            = 6      # 5 arm joints + gripper
arm_joint_dim         = 5
action_space          = "joint_pos"
conditioning_fps      = 30     # matches the dataset; wrong fps shifts time conditioning
action_normalization  = "minmax"
lora_alpha            = 32     # must match the run's [model] block
lora_rank             = 16

# -- evaluation --------------------------------------------------------------
task           = "So101Bench-Bin-v0"
episodes_jsonl = "tasks/focus5.jsonl"
layouts_glob   = "tasks/layouts/focus5_layouts_*.jsonl"
action_horizon = 32

# -- ports -------------------------------------------------------------------
policy_port = 8000
web_port    = 8800
